[package]
name = "rgen-biome"
version = "0.1.0"
edition = "2024"

[dependencies]
lazy_static = "1.4.0"
rgen-spline.workspace = true
rgen-base.workspace = true
rgen-llama.workspace = true
rgen-placer.workspace = true
rgen-world.workspace = true
smallvec = "1.13.2"
lru = "0.12.5"
puffin = "0.19.1"
log = "0.4.22"

[features]
# Everything the terrain inspector needs from the generator: the height splines
# are changeable at runtime with `set_splines`, and blocks with unknown props
# get their default state. Off for the game.
inspector = ["rgen-world/inspector"]
