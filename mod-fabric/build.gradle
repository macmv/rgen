plugins {
  id 'fabric-loom' version '1.19.2' apply false
}

// 1.12.2 is the version that `common/` is written for, which makes it the active version in
// `stonecutter.gradle`. It only exists so that stonecutter processes the sources for all of the
// versions we actually build, so there is nothing to build here.
if (stonecutter.current.version == '1.12.2') {
  return
}

apply plugin: 'fabric-loom'

version = '1.0'
group = 'net.macmv.rgen'
base.archivesName = 'rgen'

loom {
  splitEnvironmentSourceSets()

  mods {
    "rgen" {
      sourceSet sourceSets.main
      sourceSet sourceSets.client
    }
  }
}

dependencies {
  minecraft "com.mojang:minecraft:${stonecutter.current.version}"
  mappings "net.fabricmc:yarn:${property('yarn_mappings')}:v2"
  modImplementation "net.fabricmc:fabric-loader:0.16.10"
  // Registering blocks needs the registries to be unfrozen, which the api does.
  modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_api')}"
}

// Backports. Each flag is true on versions where vanilla has the feature, and the sources use it
// like `//? if vanilla_moss {`. Where it is true, we use the vanilla block instead of registering
// our own. To backport something new, add its flag here (with the first version that has it).
def since = { String version -> stonecutter.eval(stonecutter.current.version, ">=${version}") }

stonecutter.constants {
  put "vanilla_moss", since("1.17")
}

tasks.withType(JavaCompile).configureEach {
  it.options.release = 21
  it.options.compilerArgs << '-Xmaxerrs' << '2000'
}

// Most of `src/main/java` is generated by `transformCommonSources`, see `stonecutter.gradle`. That
// has to happen before stonecutter processes the sources.
tasks.matching { it.name.startsWith('stonecutter') }.configureEach {
  dependsOn ':mod-fabric:transformCommonSources'
}

// The assets are shared with 1.12, with a few things renamed (`blocks` is `block` now). The item
// models and the language file only exist for fabric, see `tools/gen_fabric_assets.py`.
processResources {
  from(rootProject.file('common/src/main/resources/assets')) {
    into 'assets'
    exclude '**/*.lang', '**/*DELETEME*'

    eachFile { details ->
      details.path = details.path.replace('/textures/blocks/', '/textures/block/').replace('/textures/items/', '/textures/item/')
    }

    // Blockstates are relative to `models/block` on 1.12.
    filesMatching('**/blockstates/*.json') {
      filter { line -> line.replaceAll('"model": *"rgen:', '"model": "rgen:block/') }
    }

    filesMatching('**/*.json') {
      filter { line -> line.replaceAll('"(rgen:|minecraft:)?blocks/', '"$1block/').replaceAll('"(rgen:|minecraft:)?items/', '"$1item/') }
    }
  }
}

// Gradle has to run on a newer java than minecraft can use (see the docs), so the game gets its own.
tasks.withType(JavaExec).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

java {
  withSourcesJar()

  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}


jar {
  inputs.property "archivesName", project.base.archivesName

  from("LICENSE") {
    rename { "${it}_${inputs.properties.archivesName}" }
  }
}
