pluginManagement {
  repositories {
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    maven {
      name = 'KikuGie'
      url = 'https://maven.kikugie.dev/releases'
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

plugins {
  id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = "rgen"

// `mod-fabric` is a stonecutter project. Each version listed here gets its own subproject, which
// reads its settings from `mod-fabric/versions/<version>/gradle.properties`.
stonecutter {
  kotlinController = false
  centralScript = "build.gradle"

  create(":mod-fabric") {
    versions "1.12.2", "1.21.1", "1.21.5"
    vcsVersion = "1.12.2"
  }
}
